syntax = "proto3";

package motion;

// motion-runtime 0.7.0 — thin translation layer.
//
// Leaves read/write by field name; runtime looks up (slave_position, offset,
// type) in the YAML contract and does the actual PDO byte I/O.
//
// Core stance: runtime understands no business semantics; leaves know nothing
// about byte layouts. The three parties (leaf / runtime / external controller
// code) couple only through "the set of field names"; the YAML contract is
// the single source of truth.

service MotionService {
  // Encode the value and write it into the slave's RxPDO output buffer.
  // It goes out on the next EtherCAT cycle.
  rpc WriteField(WriteFieldRequest) returns (WriteFieldResponse);

  // Atomic multi-field write. Runtime stages all fields, validates the
  // whole set, then commits them in one shared-memory snapshot — the
  // external controller (SPEL+) never sees a torn write where some
  // fields are new and some still hold previous values.
  //
  // Semantics: all-or-nothing. If any field is unknown / type-mismatched
  // / rejected, ok=false and nothing is committed; failed_field names
  // the first offender.
  rpc WriteFields(WriteFieldsRequest) returns (WriteFieldsResponse);

  // Decode a field from the slave's most-recent TxPDO input buffer.
  rpc ReadField(ReadFieldRequest) returns (ReadFieldResponse);
}

// ---------- Requests / Responses ----------

message WriteFieldRequest {
  string device = 1;   // Logical device name from the contract (e.g. "arm", "valve_bank")
  string field  = 2;   // Field name as declared in the contract
  Value  value  = 3;   // Value to write; its variant must match the field's type
}

message WriteFieldResponse {
  bool   ok    = 1;
  string error = 2;    // Populated when ok=false (unknown field, type mismatch, etc.)
}

message FieldValue {
  string field = 1;
  Value  value = 2;
}

message WriteFieldsRequest {
  string device = 1;
  repeated FieldValue fields = 2;
}

message WriteFieldsResponse {
  bool   ok           = 1;
  string error        = 2;   // Error description when ok=false
  string failed_field = 3;   // First field that failed validation (empty when ok=true)
}

message ReadFieldRequest {
  string device = 1;
  string field  = 2;
}

message ReadFieldResponse {
  bool   ok    = 1;
  string error = 2;
  Value  value = 3;    // Populated when ok=true; variant is determined by the contract
}

// ---------- Value (oneof) ----------

// Exactly one variant is set per Value. This set is what we support today;
// extend the oneof if a new type is needed.
message Value {
  oneof kind {
    bool   v_bool  = 1;
    int32  v_i32   = 2;
    uint32 v_u32   = 3;
    int64  v_i64   = 4;
    uint64 v_u64   = 5;
    float  v_f32   = 6;
    double v_f64   = 7;
    bytes  v_bytes = 8;   // Fallback slot for strings / raw bytes
  }
}
