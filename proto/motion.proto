syntax = "proto3";

package motion;

// motion-runtime 0.8.0 — goal service layer.
//
// Leaves submit business-level goals ("do a LINEAR move to (x, y, z, u) at
// speed N"); runtime owns the field-level write/trigger/done handshake plus
// EtherCAT byte translation. Field-level RPCs are intentionally not exposed:
// the protocol contract between Python and Rust is the goal vocabulary, not
// the wire layout.
//
// Atomicity: runtime stages target fields in a shadow PDO buffer and commits
// them as one snapshot before raising the trigger edge — the external
// controller never sees a torn write.
//
// Status: submit is non-blocking. The runtime starts the handshake, returns
// immediately, and the caller polls Read*Status for done/busy/error. A BT
// leaf's on_running ticks once per BT tick and reads status — submit must
// not block the tick.

service MotionService {
  // SCARA (4-DOF): x, y, z, u — used for Epson LS6 today.
  rpc SubmitScaraGoal(ScaraGoal) returns (GoalResponse);
  rpc ReadScaraStatus(StatusRequest) returns (ScaraStatusResponse);

  // Generic 6-DOF arm (x, y, z, rx, ry, rz). Reserved for the first
  // EtherCAT-fronted 6-DOF arm we integrate; message shape may evolve when
  // a concrete device drives the requirements.
  rpc SubmitArm6Goal(Arm6Goal) returns (GoalResponse);
  rpc ReadArm6Status(StatusRequest) returns (Arm6StatusResponse);
}

// ---------- Motion types ----------

// Motion4 enumerates the moves a 4-DOF arm can do. Each value maps to a
// routine number declared in the device's contract.yaml (motion_routines
// table) — runtime translates motion → routine before writing the field.
enum Motion4 {
  MOTION4_UNSPECIFIED = 0;
  MOTION4_GO     = 1;   // PTP (joint-interpolated) to Cartesian target
  MOTION4_JUMP   = 2;   // Gate motion (up → over → down)
  MOTION4_LINEAR = 3;   // Cartesian-straight (CP) motion
  MOTION4_HOME   = 4;   // Return to home
}

// Motion6 enumerates the moves a generic 6-DOF arm can do. Mirrors Motion4
// minus JUMP (Cartesian gate motion is SCARA-specific).
enum Motion6 {
  MOTION6_UNSPECIFIED = 0;
  MOTION6_GO     = 1;   // PTP to Cartesian target
  MOTION6_LINEAR = 2;   // Cartesian-straight motion
  MOTION6_HOME   = 3;
}

// ---------- Goals ----------

// SCARA goal. Flat fields — no nested pose/params sub-messages.
message ScaraGoal {
  string  device = 1;
  Motion4 motion = 2;

  // Cartesian target (mm + degrees). For HOME the target fields are ignored.
  float x = 3;
  float y = 4;
  float z = 5;
  float u = 6;     // rotation about Z, degrees

  // Motion parameters. Units / ranges follow the device contract; runtime
  // does not validate, just encodes.
  uint32 speed = 7;
  uint32 accel = 8;
}

// 6-DOF goal. Same flat-fields convention as ScaraGoal.
message Arm6Goal {
  string  device = 1;
  Motion6 motion = 2;

  float x  = 3;
  float y  = 4;
  float z  = 5;
  float rx = 6;
  float ry = 7;
  float rz = 8;

  uint32 speed = 9;
  uint32 accel = 10;
}

// ---------- Responses ----------

// GoalResponse is the immediate acknowledgement of a Submit*Goal call. It
// only reports whether the runtime accepted the request and started the
// handshake — completion is observed via Read*Status. Intentionally minimal;
// goal_id / tracking fields will be added when halt (NEXT-011) lands.
message GoalResponse {
  bool   ok    = 1;
  string error = 2;   // populated when ok=false
}

message StatusRequest {
  string device = 1;
}

// ScaraStatusResponse mirrors the device's TxPDO output area: handshake
// flags, the most recent error code, and the live commanded pose / joint
// angles.
message ScaraStatusResponse {
  bool   ok    = 1;
  string error = 2;   // populated when ok=false (e.g. device not found)

  // Handshake state.
  bool   done       = 3;
  bool   busy       = 4;
  uint32 error_code = 5;

  // Live Cartesian pose (mm + degrees).
  float current_x = 6;
  float current_y = 7;
  float current_z = 8;
  float current_u = 9;

  // Live joint angles (degrees / mm depending on the joint).
  float joint_1 = 10;
  float joint_2 = 11;
  float joint_3 = 12;
  float joint_4 = 13;
}

// Arm6StatusResponse — same shape as Scara, with a 6-DOF pose and up to
// 6 joints. Joints beyond what the device exposes stay zero.
message Arm6StatusResponse {
  bool   ok    = 1;
  string error = 2;

  bool   done       = 3;
  bool   busy       = 4;
  uint32 error_code = 5;

  float current_x  = 6;
  float current_y  = 7;
  float current_z  = 8;
  float current_rx = 9;
  float current_ry = 10;
  float current_rz = 11;

  float joint_1 = 12;
  float joint_2 = 13;
  float joint_3 = 14;
  float joint_4 = 15;
  float joint_5 = 16;
  float joint_6 = 17;
}
