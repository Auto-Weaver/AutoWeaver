[package]
name = "motion-runtime"
version = "0.7.0"
edition = "2021"

[features]
# `igh` enables linking against libethercat and compiling the IgH-driven
# master loop. Disabled by default so unit tests run on dev machines that
# don't have IgH installed. Enable for production builds:
#   cargo build --release --features igh
default = []
igh = []

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[build-dependencies]
tonic-build = "0.12"
