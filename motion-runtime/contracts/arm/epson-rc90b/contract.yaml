# EtherCAT data area contract for Epson RC90-B (controlling LS6-B602C).
#
# This contract and controller_program.spel are tightly coupled: every field's
# offset / type must match exactly on both sides. Change one and you MUST
# change the other, otherwise the PDO link still works but semantics drift —
# the hardest class of bug to track down. `protocol_version` exists to be
# checked at startup to catch this.
#
# The PDO indices, sizes, and CoE object indices below are derived from the
# vendor's ESI file (EPSN_RC90_ECT_V2.3_for_OMRON_rev2.xml in this directory).
# See esi-notes.md for the digest of relevant facts.
#
# Field-level offsets within the data area are OUR choice (subject to the
# controller-side SPEL+ program agreeing with them via the bit/port-number
# arithmetic documented in esi-notes.md). The numbers below are the design
# starting point; verify on hardware as part of commissioning.

device: arm
description: "Epson LS6-B602C via RC90-B EtherCAT slave option board"
protocol_version: 1

# Identify the slave by Epson's vendor + product code (from ESI).
# vendor_id 0x057E = Epson; product_code 0x00000003 = RC90_Slave.
slave_match:
  vendor_id: 0x057E
  product_code: 0x00000003

# PDO mapping — default USINT 32-byte assemblies (RxPDO 0x1600, TxPDO 0x1A00).
# Both directions: 32 bytes each, master-side byte offset addressing,
# corresponding to CoE objects 0x2100 (output) and 0x2000 (input) subindex
# 1..32 (each subindex = 1 byte / USINT).
#
# On the SPEL+ side the same bytes appear as Fieldbus I/O starting at bit
# offset 512 (default). Byte 0 of the master's RxPDO output corresponds to
# SPEL+ port In(64); see esi-notes.md "Port-number arithmetic" for the
# conversion rules.
pdo_mapping:
  rx_pdo_index: 0x1600
  rx_pdo_size: 32
  tx_pdo_index: 0x1A00
  tx_pdo_size: 32

# ---- Field table ----
# dir: out  → master writes; offset is the byte position within RxPDO (0..31)
# dir: in   → master reads;  offset is the byte position within TxPDO (0..31)
# For bit fields (type=bool with `bit:`), `offset` is the byte and `bit` is
# the bit index 0..7 within that byte.
#
# Multi-byte values (u16, f32) are little-endian on the wire (IgH default,
# matches typical x86 master behavior). Confirm on bring-up.
fields:
  # ── RxPDO (master → SPEL+) ──
  target_x:    { offset: 0,  type: f32,  dir: out }
  target_y:    { offset: 4,  type: f32,  dir: out }
  target_z:    { offset: 8,  type: f32,  dir: out }
  target_u:    { offset: 12, type: f32,  dir: out }
  speed:       { offset: 16, type: u16,  dir: out }
  routine:     { offset: 18, type: u8,   dir: out }   # 1=Go, 2=Jump, 3=Move, 4=Home
  trigger:     { offset: 19, type: bool, dir: out, bit: 0 }
  # bytes 20..31 reserved for future fields; do not write garbage from leaf side

  # ── TxPDO (SPEL+ → master) ──
  done:        { offset: 0,  type: bool, dir: in,  bit: 0 }
  busy:        { offset: 0,  type: bool, dir: in,  bit: 1 }
  error_code:  { offset: 2,  type: u16,  dir: in }
  # bytes 4..31 reserved for future fields (e.g. live position, controller status word)
